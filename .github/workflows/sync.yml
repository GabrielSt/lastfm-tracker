name: Daily Last.fm Sync

on:
  # Roda todo dia às 6h UTC (3h BRT)
  schedule:
    - cron: '0 6 * * *'

  # Permite disparar manualmente pela interface do GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # precisa para fazer commit dos JSONs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sync script dependencies
        run: npm install
        working-directory: scripts

      - name: Run sync
        env:
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MAX_PAGES: ${{ vars.MAX_PAGES || '0' }}
        run: npx tsx sync.ts
        working-directory: scripts

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          # Só commita se houver mudanças
          git diff --cached --quiet || git commit -m "sync: daily Last.fm data $(date -u +%Y-%m-%d)"
          git push
